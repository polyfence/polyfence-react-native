buildscript {
    ext.safeExtGet = {prop, fallback ->
        rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:${safeExtGet('agpVersion', '8.2.0')}"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${safeExtGet('kotlinVersion', '1.9.25')}"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace "io.polyfence.reactnative"
    compileSdkVersion safeExtGet('compileSdkVersion', 35)

    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', 24)
        targetSdkVersion safeExtGet('targetSdkVersion', 35)
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main {
            java.srcDirs += 'src/main/kotlin'
        }
        test {
            java.srcDirs += 'src/test/kotlin'
        }
    }

    testOptions {
        unitTests {
            // Robolectric needs Android resources on the unit-test classpath to
            // hand out a real Application context, which is what makes
            // ContextCompat.checkSelfPermission observable in the permission
            // matrix tests.
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }

    lintOptions {
        baseline file("lint-baseline.xml")
    }
}

repositories {
    mavenCentral()
    google()
}

dependencies {
    compileOnly "com.facebook.react:react-android:${safeExtGet('reactNativeVersion', '0.76.7')}"
    // Coordinated major with the polyfence-core 3.0.0 release train — introduces
    // the durable pending-events queue primitive and the companion helpers
    // (LocationTracker.setBridgeAttached, drainPendingEvents,
    // pendingEventsDroppedCount) that this bridge exposes to JS.
    implementation "io.polyfence:polyfence-core:3.0.0"
    implementation "com.google.android.gms:play-services-location:21.3.0"
    implementation "androidx.core:core-ktx:1.15.0"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.mockito.kotlin:mockito-kotlin:5.4.0"
    testImplementation "org.mockito:mockito-inline:5.2.0"
    // Newer mockito-core is required for JDK 17 mock support of static/companion members.
    testImplementation "org.mockito:mockito-core:5.14.2"
    // react-android is compileOnly on the main source set (RN is provided at
    // runtime by the host app); the reflection-based parity tests need
    // com.facebook.react.bridge.ReactMethod on the test classpath too.
    testImplementation "com.facebook.react:react-android:${safeExtGet('reactNativeVersion', '0.76.7')}"
    // Robolectric supplies a real Application context with a controllable SDK
    // level and grant set, which is the only way to assert the permission gate
    // at a specific API level — a plain JVM stub reports SDK_INT as 0 and every
    // version branch collapses.
    testImplementation "org.robolectric:robolectric:4.11.1"
    testImplementation "androidx.test:core:1.5.0"
}
